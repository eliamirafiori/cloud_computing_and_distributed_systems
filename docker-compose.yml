networks:
  my-network:
    driver: bridge

services:
  redis:
    image: redis
    container_name: my_redis
    volumes:
      - ./data:/app/data
    ports:
      - "6379:6379"
    networks:
      - my-network
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    container_name: my_ollama
    volumes:
      - ./ollama:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - my-network
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: "all"
              capabilities: [gpu]

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: rq worker --with-scheduler --url redis://redis:6379/0 default
    container_name: my_worker
    networks:
      - my-network
    depends_on:
      - redis
      - ollama

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: my_backend
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    networks:
      - my-network
    restart: unless-stopped
    depends_on:
      - redis
      - ollama
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 5

  k6:
    image: grafana/k6
    container_name: my_k6
    command: run /scripts/script.js
    volumes:
      - ./k6:/scripts
    networks:
      - my-network
    depends_on:
      redis:
        condition: service_started
      ollama:
        condition: service_started
      backend:
        condition: service_started # service_healthy
