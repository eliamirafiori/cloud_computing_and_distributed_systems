global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # redis-exporter: exposes the RQ queue length metric (redis_key_size) —
  # same metric that drives the custom HPA in the k8s deployment.
  - job_name: "redis-exporter"
    static_configs:
      - targets: ["redis-exporter:9121"]
