# Grafana NodePort Service
#
# Exposes Grafana on a fixed NodePort (30001) so the dashboard is reachable
# from any node without port-forward:
#   http://192.168.1.150:30001  (or .151 / .152)
#
# This is a SEPARATE Service on purpose: the kube-prometheus-stack chart owns
# the main grafana Service (ClusterIP), and a helm upgrade would overwrite any
# manual patch on it. An extra Service selecting the same pods is not touched
# by the chart, so the NodePort survives upgrades.
apiVersion: v1
kind: Service
metadata:
  name: grafana-nodeport
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: kube-prometheus-stack
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: kube-prometheus-stack
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30001
