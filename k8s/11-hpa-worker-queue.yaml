# Single HPA for the WORKER: scales on both CPU and RQ queue length.
#
# Kubernetes allows only ONE HPA per Deployment (two HPAs on the same target
# cause "AmbiguousSelector"), so CPU and queue metrics are combined here.
# The HPA computes replicas for each metric and uses the highest value.
#
# Metric 1 (CPU): scale when average CPU usage > 70% of requests (250m).
# Metric 2 (queue): scale when (queued jobs) / (number of workers) > 5.
#   The metric comes from redis-exporter -> Prometheus -> prometheus-adapter
#   (external metric "rq_queue_length").
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker-hpa
  namespace: miraflix
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker
  minReplicas: 1
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: External
      external:
        metric:
          name: rq_queue_length
        target:
          type: AverageValue
          averageValue: 5
