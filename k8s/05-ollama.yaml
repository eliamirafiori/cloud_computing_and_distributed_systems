# Ollama — models on NFS, CPU only (no GPU on the VMs).
# The embedding model is pulled automatically at startup by the initContainer,
# so a fresh cluster works without manual `ollama pull` (saved on the NFS PVC).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: miraflix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      initContainers:
        - name: pull-model
          image: ollama/ollama:latest
          command:
            - /bin/sh
            - -c
            - |
              ollama pull embeddinggemma
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
          env:
            - name: OLLAMA_NUM_PARALLEL
              value: "2"
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "1"
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  namespace: miraflix
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  # REQUIRED NAME: the code calls Client(host="http://ollama:11434") hardcoded
  name: ollama
  namespace: miraflix
spec:
  selector:
    app: ollama
  ports:
    - port: 11434
      targetPort: 11434
