# Ollama — modelli su NFS, CPU only (niente GPU sulle VM)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: miraflix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
          env:
            - name: OLLAMA_NUM_PARALLEL
              value: "2"
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "1"
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  namespace: miraflix
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  # NOME OBBLIGATORIO: il codice usa Client(host="http://ollama:11434") hardcoded
  name: ollama
  namespace: miraflix
spec:
  selector:
    app: ollama
  ports:
    - port: 11434
      targetPort: 11434
