# Redis — coda RQ (dati transitori)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: miraflix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  # NOME OBBLIGATORIO: il codice usa Redis(host="redis") hardcoded
  name: redis
  namespace: miraflix
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
