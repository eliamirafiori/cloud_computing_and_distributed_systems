# Values for prometheus-adapter (installed via helm in the monitoring namespace).
#
# WHAT IT DOES: exposes the RQ "videos" queue length (read by redis-exporter
# through Prometheus) as the external metric "rq_queue_length", usable by HPAs.
#
# Chain: Redis -> redis-exporter (metric redis_key_size) -> Prometheus
#        -> prometheus-adapter (here) -> HPA worker-hpa
#
# NOTE: the chart expects "rules.custom" / "rules.external" as lists, plus
# empty resource sections. A bare "rules:" list breaks the resource template.
#
# NOTE: modern redis_exporter (v1.89+) names the check-key metric
# redis_key_size (NOT redis_key_llen).
#
# Prometheus endpoint: MUST point at the kube-prometheus-stack Prometheus
# service (default in the chart is prometheus.default.svc which does not exist).
prometheus:
  url: http://kube-prometheus-stack-prometheus.monitoring.svc
  port: 9090

rules:
  default: false
  custom: []
  resource: {}
  # External metric: putting the rule here (instead of rules.custom) is what
  # makes the chart create the external.metrics.k8s.io APIService and exposes
  # the metric for HPA type: External.
  external:
    - seriesQuery: 'redis_key_size{key="rq:queue:videos"}'
      resources:
        # Required: without resource overrides the adapter fails with
        # "unable to convert resource namespaces into label".
        overrides:
          namespace:
            resource: namespace
          pod:
            resource: pod
      name:
        as: rq_queue_length
      metricsQuery: 'sum(redis_key_size{key="rq:queue:videos"})'
